<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REINCANTAMENTO pixel lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
<header>
<h1>PIXEL LAB</h1>
<nav id="sets" aria-label="Set"></nav>
</header>
<main>
<section id="list" aria-label="Icone"></section>
<section id="editor">
<div class="row"><span class="lbl">Nome</span><strong id="name"></strong><span id="lock" class="tag" hidden>riferimento brand</span></div>
<div id="stage">
<div id="canvaswrap"><canvas id="cv"></canvas></div>
<div id="side">
<div class="prev" id="prev"></div>
<div id="stats"></div>
<div id="refbox" hidden><span class="lbl">Confronto</span><div class="prev" id="ref"></div></div>
</div>
</div>
<div class="row"><span class="lbl">Disegno</span>
<button id="sym" title="Simmetria di pittura">Simmetria: no</button>
<button id="showref" title="Mostra occhio e goccia alla stessa scala">Confronto brand</button>
<button data-op="undo" title="⌘Z">Annulla</button>
<button data-op="redo" title="⇧⌘Z">Ripeti</button>
<button data-op="reset">Originale</button>
</div>
<div class="row"><span class="lbl">Operazioni</span>
<button data-op="stairs" title="Ogni giunto diagonale diventa un gradino, come nel logo">Gradini</button>
<button data-op="orphans">Togli orfani</button>
<button data-op="flipH">Rifletti ↔</button>
<button data-op="flipV">Rifletti ↕</button>
<button data-op="rot180">Ruota 180°</button>
<button data-op="outline">Contorno</button>
<button data-op="fill">Riempi</button>
<button data-op="dither">Retino</button>
<button data-op="invert">Inverti</button>
</div>
<div class="row"><span class="lbl">Sposta</span>
<button data-op="L" aria-label="Sposta a sinistra">←</button>
<button data-op="R" aria-label="Sposta a destra">→</button>
<button data-op="U" aria-label="Sposta su">↑</button>
<button data-op="D" aria-label="Sposta giù">↓</button>
<span class="lbl gap">Tela</span>
<button data-op="addC">+ col</button><button data-op="remC">− col</button>
<button data-op="addR">+ riga</button><button data-op="remR">− riga</button>
<button data-op="trim">Rifila</button>
</div>
<div class="row"><span class="lbl">Colore</span>
<button class="ink on" data-ink="#0000FF">Blu</button>
<button class="ink" data-ink="#D9D9D9">Grigio</button>
<button class="ink" data-ink="#000000">Nero</button>
</div>
<div class="row"><span class="lbl">Modulo SVG</span>
<button class="mod on" data-mod="eye" title="4.872 pt, come logo.svg e marchio.svg">occhio 4.872</button>
<button class="mod" data-mod="drop" title="8.619 pt, come la goccia">goccia 8.619</button>
<button class="mod" data-mod="unit" title="1 unità per pixel">1</button>
</div>
<div class="row"><span class="lbl">Esporta</span>
<button data-ex="png">PNG ×32</button>
<button data-ex="svg">SVG</button>
<button data-ex="zip">Set in ZIP</button>
<button data-ex="json">Tutto in JSON</button>
<label class="btn">Importa JSON<input type="file" id="import" accept="application/json,.json" hidden></label>
</div>
<div id="msg" role="status"></div>
</section>
</main>
<script src="src/icons.js"></script>
<script src="src/grid.js"></script>
<script src="src/app.js"></script>
</body>
</html>
